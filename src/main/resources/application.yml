spring:
  application:
    name: ai-servicenow

  # ============================================================
  # PostgreSQL Database Configuration
  # ============================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tietopocdb}
    username: ${SPRING_DATASOURCE_USERNAME:tieto}
    password: ${SPRING_DATASOURCE_PASSWORD:tieto@123}
    driver-class-name: org.postgresql.Driver

  # ============================================================
  # JPA / Hibernate Configuration
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ============================================================
  # RabbitMQ Configuration
  # ============================================================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
          max-interval: 10000

  # ============================================================
  # SQL Initialization
  # ============================================================
  sql:
    init:
      mode: always

# ==============================================================
# Azure OpenAI / external integrations
# ==============================================================
  ai:
    azure:
      openai:
    # Default to the local WireMock mock used for development/testing when
    # AZURE_OPENAI_ENDPOINT is not set. When running the app in Docker Compose
    # use 'http://wiremock:8080'. If running the app on the host and WireMock
    # is also running on the host, set AZURE_OPENAI_ENDPOINT to 'http://localhost:8081'.
        endpoint: ${AZURE_OPENAI_ENDPOINT:http://wiremock:8080}
        api-key: ${AZURE_OPENAI_API_KEY:mock-key}
        model: ${AZURE_OPENAI_MODEL:gpt-4o-mini}

# ==============================================================
# Dynatrace configuration  UXAEs8vS5MwpDwXuTiUb31SdFTGe5P7BCusFyydnZdw
# ==============================================================
dynatrace:
  api-url: ${DT_API_URL:https://tpa39707.live.dynatrace.com}
  api-token: ${DT_API_TOKEN:dt0s16.NHGNR3EY.5CVFBX7VYFTGX7VHIQCMKLXB5AE245PSXHDBE6RCPEYKU7I46KFVFXF2LSR6WPYY}
  webhook-auth-token: ${DT_WEBHOOK_AUTH_TOKEN:test-token}

# ==============================================================
# ServiceNow configuration
# ==============================================================
servicenow:
  instance-url: ${SN_INSTANCE_URL:https://dev316191.service-now.com}
  username: ${SN_USERNAME:admin}
  password: ${SN_PASSWORD:y3W+jvQhI4Q-}

# ==============================================================
# Server Configuration
# ==============================================================
server:
  port: 8080

# ==============================================================
# Actuator / Monitoring
# ==============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# ==============================================================
# Logging
# ==============================================================
logging:
  level:
    root: INFO
    com.tieto.poc: INFO
    org.springframework.amqp: INFO